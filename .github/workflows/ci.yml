name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Test, lint and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --release --all-features

      # Requirement D: body parsing must build without std. This compiles but
      # runs nothing, because every test module is gated on the std feature.
      - name: Build without std
        run: cargo test --release --no-default-features --features body-parse

      - name: Document
        run: cargo doc --no-deps

  fuzz-corpus:
    name: Fuzz corpus regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # -runs=0 executes every stored input once and exits. Fuzzing for a fixed
      # time instead would let an unrelated new find turn a pull request red.
      # The target is pinned because a musl-built cargo-fuzz otherwise defaults
      # to musl, whose static libc cannot link the sanitizer.
      - name: Replay corpora
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            fuzz_scanner_regions fuzz/corpus/fuzz_scanner_regions/ -- -runs=0
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            fuzz_preprocessor_preprocess fuzz/corpus/fuzz_preprocessor_preprocess/ -- -runs=0
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            fuzz_parse_body fuzz/corpus/fuzz_parse_body/ -- -runs=0
